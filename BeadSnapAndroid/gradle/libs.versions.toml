[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.2"
activityCompose = "1.9.0"
composeBom = "2024.06.00"
navigationCompose = "2.7.7"
lifecycleViewmodelCompose = "2.8.2"
kotlinxSerializationJson = "1.7.0"
okhttp = "4.12.0"
securityCrypto = "1.1.0-alpha06"
coil = "2.6.0"
windowSizeClass = "1.3.0"
coroutines = "1.8.1"
# Play Billing. Note the artifact below is `billing`, NOT `billing-ktx`:
# billing-ktx is compiled with a much newer Kotlin than this project uses
# (9.1.0 emits metadata 2.3.0, and drags in kotlin-stdlib 2.2.10), and a
# Kotlin 2.0 compiler cannot read either - it fails with "Module was compiled
# with an incompatible version of Kotlin", and K2 then crashes with an
# internal compiler error while trying to report it. The base artifact carries
# no Kotlin metadata. Nothing in TipJarManager uses the ktx module: it only
# adds suspend wrappers, and we use the listener API throughout.
#
# If this is ever raised again, either keep it on `billing`, or upgrade the
# Kotlin version below to match what the ktx module was built with.
#
# 8.0.0, not 9.1.0, and deliberately: 8.0.0 is exactly the floor Google set
# for the 31 Aug 2026 cutoff, and the app advertises whatever it links as
# com.google.android.play.billingclient.version in the merged manifest -
# which is one of the things Play uses to decide which devices can run the
# app. Going past the stated requirement bought nothing and put that number
# ahead of the device catalogue. Take the floor, not the newest.
#
# Every v8 API this app uses arrived IN 8.0.0 - PendingPurchasesParams on
# enablePendingPurchases, enableAutoServiceReconnection, and the
# QueryProductDetailsResult form of the queryProductDetailsAsync callback -
# so TipJarManager compiles against it unchanged.
billing = "8.0.0"
mlkitSubjectSegmentation = "16.0.0-beta1"
exifinterface = "1.3.7"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "windowSizeClass" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
mlkit-subject-segmentation = { group = "com.google.android.gms", name = "play-services-mlkit-subject-segmentation", version.ref = "mlkitSubjectSegmentation" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
